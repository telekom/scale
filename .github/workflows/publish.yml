name: publish to NPM
on:
  push:
    branches:
      - release
permissions:
  contents: write
  pages: write

jobs:
  deploy-storybook:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Configure CI Git User
        run: |
          git config --global user.name 'telekom'
          git config --global user.email 'telekom@users.noreply.github.com'
          git remote set-url origin https://telekom:${{ secrets.GITHUB_TOKEN }}@github.com/telekom/scale

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Bootstrap
        run: |
          yarn bootstrap

      - name: Build Components
        run: |
          yarn workspace @telekom/scale-components build

      - name: Build Storybook
        run: |
          yarn workspace @telekom/scale-storybook-vue build --quiet

      - name: Deploy Storybook
        run: |
          yarn workspace @telekom/scale-storybook-vue deploy

  publish-telekom:
    runs-on: ubuntu-22.04
    environment: RELEASE
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Authenticate with Registry
        run: |
          yarn logout
          touch .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Bootstrap
        run: |
          yarn bootstrap

      - name: Build Components
        run: |
          yarn workspace @telekom/scale-components build

      - name: Build React Proxy
        run: |
          yarn workspace @telekom/scale-components-react build

      - name: Publish to NPM
        run: |
          yarn publish-telekom

  publish-neutral:
    runs-on: ubuntu-22.04
    environment: RELEASE
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Configure CI Git User
        run: |
          git config --global user.name 'telekom'
          git config --global user.email 'telekom@users.noreply.github.com'
          git remote set-url origin https://telekom:${{ secrets.GITHUB_TOKEN }}@github.com/telekom/scale

      - name: Authenticate with Registry
        run: |
          yarn logout
          touch .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Bootstrap
        run: |
          WHITELABEL=1 yarn bootstrap

      - name: Build Components
        run: |
          WHITELABEL=1 yarn workspace @telekom/scale-components build

      - name: Prepare neutral packages
        run: |
          yarn prepare-neutral

      - name: Build React Proxy
        run: |
          yarn workspace @telekom/scale-components-react-neutral build

      - name: Publish to NPM
        run: |
          yarn publish-neutral
