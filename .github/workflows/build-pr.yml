name: build-pr
on:
  pull_request:
    branches:
      - main

jobs:
  prettier:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Run Prettier
        run: |
          yarn format

      - name: Check for uncommitted changes
        run: |
          sh scripts/porcelain.sh
  tslint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Run TSLint
        run: |
          yarn workspace @telekom/scale-components lint

  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Run unit tests
        run: |
          yarn workspace @telekom/scale-components test --spec --max-workers=8
  e2e-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Generate files
        run: |
          yarn lerna run generate

      - name: Install core E2E browser
        run: node node_modules/puppeteer/install.mjs

      - name: Run e2e tests
        run: |
          yarn workspace @telekom/scale-components test --e2e --max-workers=8 --debug

  visual-storybook:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build candidate Storybook
        run: yarn workspace @telekom/scale-visual-tests test:prepare
      - name: Upload candidate Storybook
        uses: actions/upload-artifact@v4
        with:
          name: visual-storybook-${{ github.sha }}
          path: packages/visual-tests/storybook-static
          retention-days: 1
          if-no-files-found: error

  visual-tests:
    needs: visual-storybook
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          mkdir -p /tmp/scale-visual-dependencies
          cp packages/visual-tests/package.json yarn.lock /tmp/scale-visual-dependencies/
          cd /tmp/scale-visual-dependencies
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Download candidate Storybook
        uses: actions/download-artifact@v4
        with:
          name: visual-storybook-${{ github.sha }}
          path: packages/visual-tests/storybook-static
      - name: Verify snapshot comparison policy
        working-directory: packages/visual-tests
        env:
          NODE_PATH: /tmp/scale-visual-dependencies/node_modules
        run: node scripts/check-snapshot-policy.js
      - name: Run visual tests without updating baselines
        working-directory: packages/visual-tests
        env:
          NODE_PATH: /tmp/scale-visual-dependencies/node_modules
        run: node /tmp/scale-visual-dependencies/node_modules/@playwright/test/cli.js test --update-snapshots=none
      - name: Check for snapshot changes
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- packages/visual-tests/src/__image_snapshots__
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ github.sha }}
          path: |
            packages/visual-tests/report
            packages/visual-tests/test-results
          retention-days: 7
          if-no-files-found: warn

  wrapper-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Generate files
        run: |
          yarn lerna run generate

      - name: Build Components
        run: |
          yarn workspace @telekom/scale-components build

      - name: Build React Wrapper
        run: |
          yarn workspace @telekom/scale-components-react build

      - name: Type-check React wrapper props
        run: |
          yarn workspace @telekom/scale-components-react test:types

  uncommitted-changes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Restore Lerna
        id: yarn-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Run Lerna bootstrap
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn bootstrap

      - name: Generate files
        run: |
          yarn lerna run generate

      - name: Build Components
        run: |
          yarn workspace @telekom/scale-components build

      - name: Check for uncommitted changes
        run: |
          sh scripts/porcelain.sh
